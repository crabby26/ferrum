<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ferrum</title>
  <meta name="description" content="Ferrum – Training und Ernährung tracken. Alles bleibt auf deinem iPhone.">
  <meta name="theme-color" content="#0F1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ferrum">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash"><img src="icons/icon-180.png" alt=""><span>Ferrum</span></div>

  <div id="app">
    <div id="banner-area"></div>

    <main id="views">
      <section class="view" id="view-today" data-view="today"></section>
      <section class="view" id="view-food" data-view="food"></section>
      <section class="view" id="view-train" data-view="train"></section>
      <section class="view" id="view-progress" data-view="progress"></section>
      <section class="view" id="view-settings" data-view="settings"></section>
    </main>

    <button id="workout-pill" class="workout-pill" hidden></button>

    <nav id="tabbar" class="tabbar">
      <button data-tab="today" class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Heute</span>
      </button>
      <button data-tab="food" class="tab">
        <svg viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"/><path d="M17 21V3c-2.2 1.2-3.5 4-3.5 7.5 0 2 1.2 3 3.5 3"/></svg>
        <span>Ernährung</span>
      </button>
      <button data-tab="train" class="tab">
        <svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>
        <span>Training</span>
      </button>
      <button data-tab="progress" class="tab">
        <svg viewBox="0 0 24 24"><path d="M3.5 19.5h17"/><path d="M5 15.5l4.5-4.5 3.5 3 6-7"/><path d="M15 7h4v4"/></svg>
        <span>Fortschritt</span>
      </button>
      <button data-tab="settings" class="tab">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Einstellungen</span>
        <i class="tab-dot" id="settings-dot" hidden></i>
      </button>
    </nav>
  </div>

  <div id="workout-screen" class="workout-screen" hidden></div>
  <div id="sheets"></div>
  <div id="toasts"></div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/training.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
