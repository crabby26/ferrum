# Ferrum – Mitteilungen
# Schickt Signale an dein iPhone (deutsche Zeit):
#   täglich  7:00  Erinnerung zum Wiegen
#   täglich  8:00  heutiger Trainingstag + Tagesziele
#   sonntags 18:00 Wochen-Check-in
# Den Inhalt berechnet die App selbst auf dem iPhone.
#
# Benötigte Secrets (Repository → Settings → Secrets and variables → Actions):
#   VAPID_PRIVATE_KEY   – privater Schlüssel (einmalig eingerichtet)
#   PUSH_SUBSCRIPTION   – Code aus Ferrum → Einstellungen → Mitteilungen
#
# Von Hand testen: Actions → „Morgen-Erinnerung“ → „Run workflow“ → Art wählen.

name: Morgen-Erinnerung

on:
  schedule:
    # GitHub rechnet in UTC. Je nach Sommer-/Winterzeit trifft ein anderer
    # Lauf die deutsche Uhrzeit – das Skript wählt den passenden aus.
    - cron: '0 5 * * *'    # 7 Uhr (Sommer)
    - cron: '0 6 * * *'    # 7 Uhr (Winter) bzw. 8 Uhr (Sommer)
    - cron: '0 7 * * *'    # 8 Uhr (Winter)
    - cron: '0 16 * * 0'   # Sonntag 18 Uhr (Sommer)
    - cron: '0 17 * * 0'   # Sonntag 18 Uhr (Winter)
  workflow_dispatch:
    inputs:
      art:
        description: 'Welche Mitteilung?'
        type: choice
        options: [day, weigh, checkin]
        default: day

permissions:
  contents: write

concurrency:
  group: morgen-erinnerung
  cancel-in-progress: false

jobs:
  senden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Web-Push-Bibliothek installieren
        working-directory: .github/push
        run: npm install --no-save --no-package-lock --no-audit --no-fund web-push@3.6.7

      - name: Signal senden
        working-directory: .github/push
        env:
          VAPID_PUBLIC_KEY: BLJcR8jlFdX-LbsExB6DtqSAlCuRnJ9dDUEnqIOH8HYxCq-8k8hgq7nZOFdiJuSfQYRrag2jkktWhPpGPiM21mA
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TYPE: ${{ github.event.inputs.art }}
        run: node send.mjs

      # GitHub pausiert Zeitpläne in Repositories ohne Aktivität nach 60 Tagen.
      # Ein leerer Commit alle ~45 Tage hält die Erinnerungen am Leben.
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Zeitplan aktiv halten"
            git push
          fi
